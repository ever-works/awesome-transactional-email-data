markdown: >-
  ## Overview


  Halon is a commercial SMTP server and email infrastructure platform designed
  for high-volume email sending.


  ## Features


  - Programmable scripting engine for email processing

  - Custom routing and filtering

  - DANE support for encrypted SMTP connections

  - DKIM signing and verification

  - Spam filtering integration

  - High-performance email delivery


  ## Pricing


  Commercial product with paid licensing. Contact vendor for pricing details.


  ## Deployment


  Self-hosted software.
