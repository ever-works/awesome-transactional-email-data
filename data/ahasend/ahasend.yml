markdown: >-
  ## Overview


  AhaSend is a transactional email service for developers sending
  application-generated email.


  ## Key Features


  - Free plan: 1,000 emails per month

  - Unlimited domains, team members, webhooks, and message routes in the free
  plan

  - Transactional email sending via API


  ## Pricing


  Free tier available (1,000 emails/month). Paid plans for higher volumes.
