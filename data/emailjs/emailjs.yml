markdown: >-
  ## Overview


  EmailJS allows sending emails directly from the client side without exposing
  credentials.


  ## Key Features


  - Send emails from client without exposing credentials

  - Free tier: 200 monthly requests

  - 2 email templates

  - Requests up to 50Kb

  - Limited contacts history


  ## Pricing


  Free tier (200 monthly requests). Paid plans for higher volumes.
