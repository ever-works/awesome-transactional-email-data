name: Oracle Cloud Notifications
description: Oracle Cloud offers a notifications service that includes email
  delivery as part of its free tier. The always-free plan includes 1 million
  delivery options per month and 1,000 emails sent per month, making it suitable
  for transactional email use cases at low volume.
