markdown: >-
  ## Overview


  Zoho Mail is an email hosting service that provides business email with custom
  domain support. It is part of the broader Zoho suite of business applications
  and offers a forever-free plan for small teams.


  ## Features


  - Free for up to 5 users

  - 5 GB storage per user

  - 25 MB attachment limit

  - One custom domain

  - Webmail access

  - Mobile apps


  ## Pricing


  Free plan for up to 5 users. Paid plans available for additional users and
  storage.


  ## Deployment


  Cloud (Zoho-hosted)


  ## Source


  https://www.zoho.com/mail/
