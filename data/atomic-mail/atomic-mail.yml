markdown: >-
  ## Overview


  Atomic Mail is a free email service built for AI agents and programmatic
  access.


  ## Key Features


  - Entirely free email service

  - Programmatic inbox creation

  - Custom domains support

  - Full send/receive over the open JMAP standard (RFC 8620/8621)

  - Hosted MCP server available

  - Not disposable/temporary email


  ## Pricing


  Completely free.
