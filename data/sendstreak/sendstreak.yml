markdown: >-
  ## Overview


  SendStreak is an email framework as a service that enhances your own SMTP
  server.


  ## Key Features


  - Adds templates, automations, and history to your SMTP server

  - Works with AWS, Maileroo, Gmail, and other SMTP servers

  - Free up to 100 emails per day

  - No time limit


  ## Pricing


  Free tier (100 emails/day). Paid plans for higher volumes.
