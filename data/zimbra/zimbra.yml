name: Zimbra
description: Zimbra is a commercial email and collaboration platform that
  provides email, calendaring, contacts, and document sharing capabilities.
  Originally developed by Yahoo!, it is now owned by Synacor and offers both
  open-source and network editions. Zimbra supports IMAP, POP3, and SMTP
  protocols and includes a web-based client interface.
