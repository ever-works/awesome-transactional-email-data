description: Postal v3 is a complete, fully featured open-source mail delivery
  platform for websites and web servers, designed to be self-hosted on your own
  infrastructure as an alternative to SendGrid, Mailgun, or Postmark. It offers
  a comprehensive web interface for managing mail servers and viewing mail logs,
  horizontal scaling, webhooks for delivery notifications, development mode for
  testing, IP pools for reputation management, and integrations with
  SpamAssassin, rspamd, and ClamAV for spam and antivirus scanning. Licensed
  under the MIT license, Postal is freely available to deploy and run
  independently.
