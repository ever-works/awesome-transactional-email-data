markdown: >-
  ## Overview


  Cyrus IMAP is an open-source IMAP and POP3 mail server developed by Carnegie
  Mellon University. It is designed for scalability and efficiency in
  large-scale email environments.


  ## License


  Released under a BSD-style license.


  ## Features


  - IMAP and POP3 protocols

  - Designed for large-scale deployment

  - RFC standards compliance

  - Scalable mailbox storage

  - Efficient message delivery


  ## Repository


  Source code available at https://github.com/cyrusimap/cyrus-imapd


  ## Pricing


  Free and open-source software.
