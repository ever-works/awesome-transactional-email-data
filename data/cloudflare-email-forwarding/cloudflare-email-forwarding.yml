markdown: >-
  ## Overview


  Cloudflare Email Forwarding is a free email forwarding service integrated with
  Cloudflare's DNS and security offerings. It enables users to create custom
  email addresses on their own domain and forward messages to existing email
  accounts.


  ## Features


  - Free email forwarding with custom domains

  - Spam filtering

  - Unlimited domains

  - Free SSL

  - DNS management included


  ## Pricing


  Free with Cloudflare's free DNS plan.


  ## Deployment


  Cloud (Cloudflare)


