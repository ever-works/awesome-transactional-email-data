markdown: |-
  ## Overview

  SendRaven is an email API for transactional email and agent conversations.

  ## Key Features

  - Free tier: 3,000 outbound emails per month
  - Unlimited contacts and inbound replies
  - Agent-driven conversations with threads
  - Card required

  ## Pricing

  Free tier (3,000 outbound emails/month). Paid plans for higher volumes.
